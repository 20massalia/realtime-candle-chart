spring.application.name=candle-api

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:candles}
spring.datasource.username=${POSTGRES_USER:candles}
spring.datasource.password=${POSTGRES_PASSWORD:candles}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:${SERVER_PORT:8080}}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

candle.mock-market.enabled=true
candle.mock-market.symbol=005930
candle.mock-market.interval=1m
candle.mock-market.tick-interval-ms=300
candle.mock-market.mu=0
candle.mock-market.sigma=0.03
candle.mock-market.kappa=0.02
candle.mock-market.fallback-price=75000
candle.websocket.allowed-origins=${CANDLE_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
