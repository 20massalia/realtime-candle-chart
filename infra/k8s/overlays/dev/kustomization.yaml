apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: candle-dev
resources:
  - namespace.yaml
  - ../../base
patches:
  - path: api-resources.yaml
  - path: postgres-resources.yaml
images:
  - name: candle-api
    newName: candle-api
    newTag: 0.0.1-006
  - name: postgres
    newName: postgres
    digest: sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
configMapGenerator:
  - name: api-config
    literals:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
secretGenerator:
  - name: postgres-credentials
    envs:
      - postgres.env.example
generatorOptions:
  disableNameSuffixHash: true
